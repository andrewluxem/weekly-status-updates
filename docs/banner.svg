<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">weekly-status-updates</title>
<desc id="d">Three panels from the repo's example run and its status-call rules. 1, the notes: Goal is to ship the new checkout by 04/30/2026; payment integration and cart logic are done; legal has not approved the refund copy, no date yet. 2, the rule: Green means every part of the goal is on schedule and every dependency has been identified and scheduled; both halves are required. Legal approval of the refund copy has no scheduled date. 3, the call: Yellow. Deliver the new checkout by 04/30/2026. Revised date: not yet known; can be set once legal confirms the approval date.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes r2{0%,16.7%{opacity:1}18.7%,32.2%{opacity:0}33.9%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,52.6%{opacity:0}54.3%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,59.3%{opacity:0}61%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,78.8%{opacity:0}80.5%,100%{opacity:1}}
@keyframes rg{0%,16.7%{opacity:1}18.7%,85.6%{opacity:0}87.3%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">weekly-status-updates</text>
<text x="326" y="50" class="sans" font-size="13.5" fill="#a9adb2">A portable agent skill for weekly project status updates: position against the plan</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · THE NOTES</text>
<rect x="32" y="98" width="250" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="250" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">examples/example-run.md · example</text>
<line x1="33" y1="123" x2="281" y2="123" stroke="#2e3237"/>
<g class="r1"><text x="44" y="145" class="sans" font-size="10.5" fill="#e4dfd4">Goal is to ship the new checkout by</text><text x="44" y="160" class="sans" font-size="10.5" fill="#e4dfd4">04/30/2026. Payment integration finished</text><text x="44" y="175" class="sans" font-size="10.5" fill="#e4dfd4">02/11 and cart logic is done. We are</text><text x="44" y="190" class="sans" font-size="10.5" fill="#e4dfd4">waiting on legal to approve the refund</text><text x="44" y="205" class="sans" font-size="10.5" fill="#e4dfd4">copy, Tom is chasing it,</text><text x="159" y="205" class="sans" font-size="10.5" fill="#e4dfd4">no date yet.</text></g>
<rect class="r2" x="155.5" y="194" width="62" height="15" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/>
<text x="32" y="272" class="sans cap">The work is done. Legal has no date yet.</text>
</g>

<g>
<text x="302" y="88" class="sans lab" fill="#c8963e">2 · THE STATUS CALL</text>
<rect x="302" y="98" width="286" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h2" x="302" y="98" width="286" height="152" rx="3" stroke="#c8963e"/>
<text x="314" y="115" class="mono" font-size="10" fill="#8b9096">assets/status-call.md</text>
<line x1="303" y1="123" x2="587" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="314" y="141" class="sans" font-size="10.5" fill="#e4dfd4"><tspan fill="#93ad8c" font-weight="700">Green.</tspan> Every part of the goal is on</text><text x="314" y="155" class="sans" font-size="10.5" fill="#e4dfd4">schedule, and every dependency has been</text><text x="314" y="169" class="sans" font-size="10.5" fill="#e4dfd4">identified and scheduled.</text></g>
<g class="rc"><text x="314" y="183" class="sans" font-size="10.5" fill="#c8963e" font-weight="700">Both halves are required.</text></g>
<g class="rd"><line x1="314" y1="194.5" x2="576" y2="194.5" stroke="#2e3237"/><text x="314" y="210" class="mono" font-size="10" fill="#8b9096">examples/example-run.md</text><text x="314" y="225" class="sans" font-size="10.5" fill="#e4dfd4">Legal approval of the refund copy has no</text><text x="314" y="239" class="sans" font-size="10.5" fill="#e4dfd4">scheduled date</text></g>
<text x="302" y="272" class="sans cap">Green needs a date on every dependency.</text>
</g>

<g>
<text x="608" y="88" class="sans lab" fill="#93ad8c">3 · YELLOW, WITH ITS DATE</text>
<rect x="608" y="98" width="260" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="608" y="98" width="260" height="152" rx="3" stroke="#93ad8c"/>
<text x="620" y="115" class="mono" font-size="10" fill="#8b9096">examples/example-run.md · example</text>
<line x1="609" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="re"><text x="620" y="146" class="sans" font-size="13" fill="#c8963e" font-weight="700">Yellow.</text><text x="620" y="163" class="sans" font-size="10.5" fill="#e4dfd4">Deliver the new checkout by 04/30/2026.</text></g>
<g class="rf"><text x="620" y="181" class="sans" font-size="10.5" fill="#e4dfd4">Revised date: not yet known; can be set</text><text x="620" y="195" class="sans" font-size="10.5" fill="#e4dfd4">once legal confirms the approval date.</text></g>
<g class="rg"><line x1="620" y1="207.5" x2="856" y2="207.5" stroke="#2e3237"/><text x="620" y="223" class="mono" font-size="10" fill="#8b9096">assets/status-call.md</text><text x="620" y="239" class="mono" font-size="10" fill="#c8963e" font-weight="700">Yellow</text><text x="674" y="239" class="sans" font-size="10.5" fill="#e4dfd4">Revised date if known</text></g>
<text x="608" y="272" class="sans" font-size="11.5" fill="#93ad8c">Yellow, plus what the new date waits on.</text>
</g>
</svg>
